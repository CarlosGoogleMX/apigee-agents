[project]
name = "apigee-agent-logging"
version = "0.1.0"
description = "Apigee Error Diagnostic Agent built with Google Agent Development Kit (ADK)"
authors = [{ name = "API Engineering Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.0.0",
    "google-auth>=2.0.0",
    "google-cloud-logging>=3.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apigee_agent"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true
